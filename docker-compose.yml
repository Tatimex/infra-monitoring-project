services:
  api:
    image: hashicorp/http-echo:latest
    container_name: api
    command: ["-listen=:8080", "-text=Monitoring Service Active"]
    expose:
      - "8080"            # порт доступен только внутри сети Docker, наружу не публикуется
    networks:
      - monitoring-net
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "80:80"           # хост:контейнер — наружу открыт только прокси
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - monitoring-net
    restart: unless-stopped

networks:
  monitoring-net:
    driver: bridge